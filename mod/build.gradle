plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

evaluationDependsOn(':core')

group = mod_group
version = mod_version
base.archivesName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        // Oeffnet die Presse ohne Welt, spielt ein Skript ab, speichert Screenshots und beendet sich.
        selftest {
            client()
            systemProperty 'scribery.selftest', 'true'
        }
        // Testserver fuer die Weltgenerierung: gradlew runServer -Pwgtest=scribery:catacomb,scribery:grave (siehe WorldgenTest)
        server {
            server()
            programArgument '--nogui'
            systemProperty 'scribery.worldgentest', providers.gradleProperty('wgtest').getOrElse('')
        }
        configureEach {
            gameDirectory = rootProject.file('run')
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // core hat keine Minecraft-Abhaengigkeit und laeuft als Teil desselben Mods mit.
            sourceSet project(':core').sourceSets.main
        }
    }
}

dependencies {
    implementation project(':core')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                 minecraft_version: minecraft_version, neo_version: neo_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }

    // Raster und Palette haben genau eine Quelle: art/.
    from(rootProject.file('art')) {
        include 'layout.json', 'tiles-layout.json', 'palette.json'
        into 'assets/scribery/ui'
    }
    // Die Manuskripte des Spiels, erzeugt von tools/build_manuscripts.py.
    from(rootProject.file('tools/data')) {
        // Reihenfolge ist die Reihenfolge im Evangelium: P1-P21 (Prolog), danach P22-P1540.
        include 'manuscripts.john1.json', 'manuscripts.john-rest.json', 'chapters.json', 'find-pools.json', 'ostraka-jokes.json', 'ostraka.json'
        into 'assets/scribery/data'
    }
    // Platzhalter-Fragmente fuer /scribery debug.
    from(rootProject.file('tools/examples')) {
        include 'fragments.example.json'
        into 'assets/scribery/debug'
    }
}

jar {
    from project(':core').sourceSets.main.output
}
